name: check-pull-request

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        run: |
          pattern='^(feat|fix|chore|refactor|test|docs|style|perf|ci|build)/(ENGA|PLAT)-[0-9]+(-[a-z0-9]+)*$'
          if ! echo "${{ github.head_ref }}" | grep -Eq "$pattern"; then
            echo "Branch '${{ github.head_ref }}' does not match the convention."
            echo "Use: type/ENGA-123-short-description"
            exit 1
          fi

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: make format-check

      - run: flutter analyze

      - run: flutter test
