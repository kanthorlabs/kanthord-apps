                - message
              additionalProperties: false
      required:
        - error
      additionalProperties: false
    repository.inspect.request:
      type: object
      properties:
        remoteUrl:
          type: string
          minLength: 1
        credentialId:
          type: string
          minLength: 1
      required:
        - remoteUrl
        - credentialId
      additionalProperties: false
    repository.inspect.response:
      type: object
      properties:
        defaultBranch:
          nullable: true
          type: string
        branches:
          type: array
          items:
            type: string
        credential:
          type: object
          properties:
            reachable:
              type: boolean
            refusal:
              nullable: true
              type: string
          required:
            - reachable
            - refusal
          additionalProperties: false
        hostKey:
          nullable: true
          type: object
          properties:
            algorithm:
              type: string
            fingerprint:
              type: string
          required:
            - algorithm
            - fingerprint
          additionalProperties: false
      required:
        - defaultBranch
        - branches
        - credential
        - hostKey
      additionalProperties: false
