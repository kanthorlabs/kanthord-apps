    repository.register.request:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9][a-z0-9._-]*$
        remoteUrl:
          type: string
          minLength: 1
        credentialId:
          type: string
          minLength: 1
        upstreamBranch:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._\/-]*$
        landingBranch:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[A-Za-z0-9][A-Za-z0-9._\/-]*$
        publishRef:
          type: string
          minLength: 1
          pattern: ^refs\/[A-Za-z0-9][A-Za-z0-9._\/-]*$
        publishOnApproval:
          default: true
          type: boolean
        hostFingerprint:
          default: null
          nullable: true
          type: string
          pattern: ^SHA256:[A-Za-z0-9+/]{43}$
      required:
        - name
        - remoteUrl
        - credentialId
        - upstreamBranch
        - landingBranch
        - publishRef
      additionalProperties: false
