        revision:
          nullable: true
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              kind:
                type: string
                enum:
                  - initiative
                  - objective
                  - task
              presence:
                type: string
                enum:
                  - both
                  - document-only
                  - database-only
              state:
                nullable: true
                type: string
