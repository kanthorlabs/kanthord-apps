                  - name
                additionalProperties: false
              upstreamBranch:
                type: string
              landingBranch:
                type: string
              landingRef:
                type: string
              trackingRef:
                type: string
              publishRef:
                type: string
              publishOnApproval:
                type: boolean
              state:
                type: string
                enum:
                  - ready
                  - needs-reconcile
              landingOid:
                nullable: true
                type: string
              trackingOid:
                nullable: true
                type: string
              fetchedUpstreamOid:
                nullable: true
                type: string
              divergedLandingOid:
                nullable: true
                type: string
              divergedUpstreamOid:
                nullable: true
                type: string
              updatedAt:
                type: number
            required:
              - id
              - name
              - remoteUrl
              - credential
              - upstreamBranch
              - landingBranch
              - landingRef
              - trackingRef
              - publishRef
              - publishOnApproval
              - state
              - landingOid
              - trackingOid
              - fetchedUpstreamOid
              - divergedLandingOid
              - divergedUpstreamOid
              - updatedAt
            additionalProperties: false
      required:
        - repositories
      additionalProperties: false
