    repository.list.response:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              remoteUrl:
                type: string
              credential:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                required:
