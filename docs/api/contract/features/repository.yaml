                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - host-key-mismatch
                message:
                  type: string
                details:
                  anyOf:
                    - type: object
                      properties:
                        presented:
                          type: array
                          items:
                            type: string
                        confirmed:
                          nullable: true
                          type: string
                      required:
                        - presented
                        - confirmed
                      additionalProperties: false
                    - type: object
                      properties:
                        failure:
                          type: string
                          enum:
                            - host-key-mismatch
                      required:
                        - failure
                      additionalProperties: false
              required:
                - code
                - message
                - details
              additionalProperties: false
            - type: object
