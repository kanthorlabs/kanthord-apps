openapi: 3.0.3
info:
  title: kanthord
  version: 27.8.1
security:
  - bearerAuth: []
paths:
  /v1/repository:
    get:
      operationId: repository.list
      responses:
        "200":
          description: repository.list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.list.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.list.error"
    post:
      operationId: repository.register
      responses:
        "200":
          description: repository.register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.register.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.register.error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repository.register.request"
  /v1/repository/inspect:
    post:
      operationId: repository.inspect
      responses:
        "200":
          description: repository.inspect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.inspect.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.inspect.error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repository.inspect.request"
  /v1/repository/{id}:
    get:
      operationId: repository.show
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: repository.show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.show.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repository.show.error"
  /v1/repository/{id}/landing-branch:
    post:
      operationId: repository.landingBranch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: not implemented
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/repository/{id}/publish:
    post:
      operationId: repository.publish
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: not implemented
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/repository/{id}/reconcile:
    post:
      operationId: repository.reconcile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          description: not implemented
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - invalid-request
                message:
                  type: string
                details:
                  type: object
                  properties:
                    refusal:
                      type: string
                      minLength: 1
                    detail:
                      type: string
                    ids:
                      type: array
                      items:
                        type: string
                  required:
                    - refusal
                  additionalProperties: false
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - unauthenticated
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - origin-forbidden
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - host-forbidden
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - not-found
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - internal-error
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - not-implemented
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - service-unavailable
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
      required:
        - error
      additionalProperties: false
    repository.inspect.error:
      type: object
      properties:
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - invalid-request
                message:
                  type: string
                details:
                  type: object
                  properties:
                    refusal:
                      type: string
                      minLength: 1
                    detail:
                      type: string
                    ids:
                      type: array
                      items:
                        type: string
                  required:
                    - refusal
                  additionalProperties: false
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
