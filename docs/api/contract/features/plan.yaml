              - take
            additionalProperties: false
        validatedRevision:
          nullable: true
          type: string
        documentsHash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      required:
        - fromRevision
        - importId
        - documents
        - choices
        - validatedRevision
        - documentsHash
