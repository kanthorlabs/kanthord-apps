components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    system.db.response:
      type: object
      properties:
        migrations:
          type: array
          items:
            type: object
            properties:
              version:
                type: integer
                minimum: 0
                exclusiveMinimum: true
                maximum: 9007199254740991
              name:
                type: string
                minLength: 1
              applied:
                type: boolean
              appliedAt:
                nullable: true
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
            required:
              - version
              - name
              - applied
              - appliedAt
            additionalProperties: false
      required:
        - migrations
      additionalProperties: false
    system.health.response:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        dependencies:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              status:
                type: string
                enum:
                  - ok
                  - failed
                  - not-implemented
            required:
              - name
              - status
            additionalProperties: false
      required:
        - status
        - dependencies
      additionalProperties: false
