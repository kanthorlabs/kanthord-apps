openapi: 3.0.3
info:
  title: kanthord
  version: 27.8.1
security:
  - bearerAuth: []
paths:
  /v1/project/{id}/plan/export:
    get:
      operationId: plan.export
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: plan.export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.export.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.export.error"
  /v1/project/{id}/plan/import:
    post:
      operationId: plan.import
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: plan.import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.import.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.import.error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/plan.import.request"
  /v1/project/{id}/plan/revision:
    get:
      operationId: plan.revisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: plan.revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.revisions.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.revisions.error"
  /v1/project/{id}/plan/validate:
    post:
      operationId: plan.validate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: plan.validate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.validate.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/plan.validate.error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/plan.validate.request"
