openapi: 3.0.3
info:
  title: kanthord
  version: 27.8.1
security:
  - bearerAuth: []
paths:
  /v1/event:
    get:
      operationId: event.list
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: actorKind
          in: query
          required: false
          schema:
            type: string
            enum:
              - human
              - daemon
        - name: after
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            default: 100
            type: integer
            minimum: 1
            maximum: 500
        - name: subject
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: subjectKind
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: event.list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/event.list.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/event.list.error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - invalid-request
                message:
                  type: string
                details:
                  type: object
                  properties:
                    refusal:
                      type: string
                      minLength: 1
                    detail:
                      type: string
                    ids:
                      type: array
                      items:
                        type: string
                  required:
                    - refusal
                  additionalProperties: false
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - unauthenticated
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - origin-forbidden
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - host-forbidden
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - not-found
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - internal-error
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - not-implemented
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - service-unavailable
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
      required:
        - error
      additionalProperties: false
    event.list.error:
      type: object
      properties:
        error:
          oneOf:
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - invalid-request
                message:
                  type: string
                details:
                  type: object
                  properties:
                    refusal:
                      type: string
                      minLength: 1
                    detail:
                      type: string
                    ids:
                      type: array
                      items:
                        type: string
                  required:
                    - refusal
                  additionalProperties: false
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - unauthenticated
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - origin-forbidden
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - host-forbidden
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - not-found
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - internal-error
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - not-implemented
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
            - type: object
              properties:
                code:
                  type: string
                  enum:
                    - service-unavailable
                message:
                  type: string
              required:
                - code
                - message
              additionalProperties: false
      required:
        - error
      additionalProperties: false
    event.list.response:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              subjectKind:
                type: string
              subjectId:
                type: string
              actorKind:
                type: string
                enum:
                  - human
                  - daemon
              actorId:
                type: string
              payload: {}
              createdAt:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
            required:
              - id
              - type
              - subjectKind
              - subjectId
              - actorKind
              - actorId
              - payload
              - createdAt
            additionalProperties: false
      required:
        - events
      additionalProperties: false
