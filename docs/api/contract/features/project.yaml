openapi: 3.0.3
info:
  title: kanthord
  version: 27.8.1
security:
  - bearerAuth: []
paths:
  /v1/project:
    get:
      operationId: project.list
      responses:
        "200":
          description: project.list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.list.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.list.error"
    post:
      operationId: project.create
      responses:
        "200":
          description: project.create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.create.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.create.error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/project.create.request"
  /v1/project/{id}:
    get:
      operationId: project.show
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: project.show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.show.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.show.error"
  /v1/project/{id}/repository:
    put:
      operationId: project.repositories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: project.repositories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.repositories.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.repositories.error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/project.repositories.request"
  /v1/project/{id}/status:
    get:
      operationId: project.status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: project.status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.status.response"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/project.status.error"
