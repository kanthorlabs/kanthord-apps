name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache/suite-pass
          key: suite-pass-check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-pass-check-${{ runner.os }}-

      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run format:check

      - run: pnpm run test:suite-pass --job check --write ${{ github.event_name == 'schedule' && '--full' || '' }}

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: node_modules/.cache/suite-pass
          key: suite-pass-check-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - run: pnpm run build
